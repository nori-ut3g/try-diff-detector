name: Critical Namespace Change Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  diff-detector:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for git diff

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Leiningen
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        lein: 2.10.0

    - name: Run diff-detector
      id: diff-check
      run: |
        echo "Running diff-detector..."
        
        # Run diff-detector and capture output
        set +e  # Don't exit on error
        OUTPUT=$(lein diff-detector --base ${{ github.event.pull_request.base.sha }} --target ${{ github.event.pull_request.head.sha }} --summary 2>&1)
        EXIT_CODE=$?
        set -e
        
        echo "Exit code: $EXIT_CODE"
        echo "Output: $OUTPUT"
        
        # Save output to file for multiline handling
        echo "$OUTPUT" > diff_output.txt
        
        # Set outputs for next steps
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "has_changes=$([ $EXIT_CODE -eq 1 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        
        # Save output as environment variable (escape newlines)
        {
          echo 'DIFF_OUTPUT<<EOF'
          cat diff_output.txt
          echo EOF
        } >> $GITHUB_ENV

    - name: Comment on PR - Critical Changes Detected
      if: steps.diff-check.outputs.has_changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const output = process.env.DIFF_OUTPUT;
          
          const comment = `## ⚠️ Critical Namespace Changes Detected!
          
          This PR contains changes to security-critical namespaces that require special attention.
          
          ### Diff Detector Results:
          \`\`\`
          ${output}
          \`\`\`
          
          ### Required Actions:
          - [ ] 🔍 **Security Review**: Ensure all changes follow security best practices
          - [ ] 📋 **Compliance Check**: Verify changes meet regulatory requirements  
          - [ ] 🧪 **Extended Testing**: Run additional security and integration tests
          - [ ] 👥 **Peer Review**: Get approval from security team lead
          
          ### Critical Namespaces Monitored:
          - \`security.auth.*\` - Authentication and authorization
          - \`payment.gateway.stripe\` - Payment processing  
          - \`compliance.*\` - Regulatory compliance
          - \`sample.core\` - Core business logic
          
          > **Note**: This PR will require additional approvals due to critical namespace changes.
          `;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Comment on PR - No Critical Changes
      if: steps.diff-check.outputs.has_changes == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## ✅ No Critical Namespace Changes
          
          This PR does not contain changes to monitored critical namespaces.
          
          ### Diff Detector Results:
          \`\`\`
          ${process.env.DIFF_OUTPUT}
          \`\`\`
          
          Standard review process applies. 👍
          `;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Fail workflow if critical changes detected
      if: steps.diff-check.outputs.has_changes == 'true'
      run: |
        echo "Critical namespace changes detected. This requires additional approval."
        echo "Please ensure proper security review before merging."
        exit 1