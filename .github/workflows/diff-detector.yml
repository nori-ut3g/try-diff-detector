name: Critical Namespace Change Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diff-detector:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for git diff

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Leiningen
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        lein: 2.10.0

    - name: Run diff-detector
      id: diff-check
      run: |
        echo "Running diff-detector..."
        
        # Run diff-detector and capture output
        set +e  # Don't exit on error
        OUTPUT=$(lein diff-detector --base ${{ github.event.pull_request.base.sha }} --target ${{ github.event.pull_request.head.sha }} --summary 2>&1)
        EXIT_CODE=$?
        set -e
        
        echo "Exit code: $EXIT_CODE"
        echo "Output: $OUTPUT"
        
        # Save output to file for multiline handling
        echo "$OUTPUT" > diff_output.txt
        
        # Set outputs for next steps
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "has_changes=$([ $EXIT_CODE -eq 1 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        
        # Save output as environment variable (escape newlines)
        {
          echo 'DIFF_OUTPUT<<EOF'
          cat diff_output.txt
          echo EOF
        } >> $GITHUB_ENV

    - name: Update PR Description - Critical Changes Detected
      if: steps.diff-check.outputs.has_changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const output = process.env.DIFF_OUTPUT;
          
          // Extract changed files from output
          const lines = output.split('\n');
          const changedFiles = lines
            .filter(line => line.trim().startsWith('- src/'))
            .map(line => line.trim().replace('- ', ''))
            .join('\n');
          
          // Get current PR
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          
          const criticalChangesSection = `
## ⚠️ Critical Namespace Changes Detected

**Changed Files:**
\`\`\`
${changedFiles}
\`\`\`

**Required:** Security review and additional approvals needed.
          `;
          
          // Update PR description
          const newBody = pr.body ? pr.body + '\n\n' + criticalChangesSection : criticalChangesSection;
          
          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: newBody
          });

    - name: Add Critical Changes Label
      if: steps.diff-check.outputs.has_changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['⚠️ critical-changes', 'security-review-required']
          });

    - name: Update PR Description - No Critical Changes
      if: steps.diff-check.outputs.has_changes == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          // Get current PR
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          
          const noCriticalChangesSection = `
## ✅ No Critical Namespace Changes

Standard review process applies.
          `;
          
          // Update PR description
          const newBody = pr.body ? pr.body + '\n\n' + noCriticalChangesSection : noCriticalChangesSection;
          
          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: newBody
          });

    - name: Fail workflow if critical changes detected
      if: steps.diff-check.outputs.has_changes == 'true'
      run: |
        echo "Critical namespace changes detected. This requires additional approval."
        echo "Please ensure proper security review before merging."
        exit 1