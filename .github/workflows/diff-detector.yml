name: Critical Namespace Change Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diff-detector:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for git diff

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Leiningen
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        lein: 2.10.0

    - name: Run diff-detector
      id: diff-check
      run: |
        echo "Running diff-detector..."
        
        # Run diff-detector and capture output
        set +e  # Don't exit on error
        OUTPUT=$(lein diff-detector --base ${{ github.event.pull_request.base.sha }} --target ${{ github.event.pull_request.head.sha }} --summary 2>&1)
        EXIT_CODE=$?
        set -e
        
        echo "Exit code: $EXIT_CODE"
        echo "Output: $OUTPUT"
        
        # Save output to file for multiline handling
        echo "$OUTPUT" > diff_output.txt
        
        # Set outputs for next steps
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "has_changes=$([ $EXIT_CODE -eq 1 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        
        # Save output as environment variable (escape newlines)
        {
          echo 'DIFF_OUTPUT<<EOF'
          cat diff_output.txt
          echo EOF
        } >> $GITHUB_ENV

    - name: Post Critical Changes Comment
      if: steps.diff-check.outputs.has_changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const output = process.env.DIFF_OUTPUT;

          // Extract changed namespaces from output
          const lines = output.split('\n');
          const changedNamespaces = lines
            .filter(line => line.trim().startsWith('- src/'))
            .map(line => line.trim().replace('- ', ''))
            .join('\n');

          const commentBody = '⚠️ **Critical namespace changes detected:**\n```\n' + changedNamespaces + '\n```';

          // Find existing comment from this bot
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });

          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('Critical namespace changes detected:')
          );

          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
          }


    - name: Fail workflow if critical changes detected
      if: steps.diff-check.outputs.has_changes == 'true'
      run: |
        echo "Critical namespace changes detected. This requires additional approval."
        echo "Please ensure proper security review before merging."
        exit 1